<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>__ABOUT_TITLE__</title>
    <meta name="description" content="__ABOUT_DESCRIPTION__" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="./icon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#060e08" />

    <!-- Open Graph. A studio page is a thing people paste into chat, and an
         untitled grey rectangle is a worse advertisement than no preview at
         all. Absolute URLs, because relative ones are not resolved by any
         scraper. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="__ABOUT_TITLE__" />
    <meta property="og:description" content="__ABOUT_DESCRIPTION__" />
    <meta name="twitter:card" content="summary" />

    <style>
      /* The cabinet's own palette, unchanged. The point of this page is that it
         is visibly the same machine as the game — a studio page in a different
         set of colours is a different studio as far as anyone glancing at it is
         concerned. Single-theme on purpose: this is a dark arcade cabinet, not
         a document that should follow the OS. */
      :root {
__ABOUT_TOKENS__

        /* Two faces, both already canon on this site: the heavy grotesque the
           score is drawn in, and the monospace of the byline. Nothing new is
           introduced here — the identity IS the repetition. */
        --display: "Arial Black", "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }

      html {
        background: var(--ground);
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        /* One gutter, set once, on the element that holds everything. Vertical
           padding goes through padding-block so it can never zero the sides. */
        padding-inline: 20px;
        padding-block: clamp(36px, 8vh, 88px);
        background: var(--ground);
        color: var(--faint);
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.75;
      }

      main {
        max-width: 34rem;       /* ~65 characters of the mono face */
        margin: 0 auto;
      }

      /* ---- the mark ------------------------------------------------------ */

      .mark {
        display: block;
        width: __ABOUT_MARK_W__px;
        height: auto;
        max-width: 100%;
        margin: 0 0 26px;
        /* The icon is authored for a black cabinet, so it needs no plate. */
        image-rendering: auto;
      }

      h1 {
        font-family: var(--display);
        font-size: clamp(30px, 8vw, 44px);
        line-height: 1.05;
        letter-spacing: 0.02em;
        color: var(--score);
        margin: 0 0 10px;
        text-wrap: balance;
      }

      /* The positioning line. One sentence, and the only place on the page that
         is allowed to be larger than the body text — everything below it is
         detail in support of this. */
      .line {
        font-family: var(--display);
        font-weight: 400;
        font-size: clamp(16px, 4.2vw, 19px);
        line-height: 1.45;
        color: var(--faint);
        margin: 0 0 40px;
        text-wrap: pretty;
      }

      /* ---- sections ------------------------------------------------------ */

      section { margin: 0 0 40px; }

      h2 {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--fine);
        margin: 0 0 14px;
        padding-bottom: 9px;
        border-bottom: 1px solid var(--rule);
      }

      p { margin: 0 0 15px; }
      p:last-child { margin-bottom: 0; }

      a {
        color: var(--score);
        text-decoration: underline;
        text-underline-offset: 2px;
        text-decoration-color: color-mix(in srgb, currentColor 45%, transparent);
      }
      a:hover, a:focus-visible { text-decoration-color: currentColor; }
      a:focus-visible { outline: 2px solid var(--score); outline-offset: 3px; }

      /* ---- the spec ------------------------------------------------------ */

      /* Real numbers, in the units the thing is actually built in. This is the
         one part of the page nobody else could have written, so it is given a
         proper two-column reading rather than being buried in a paragraph. */
      .spec {
        display: grid;
        grid-template-columns: 11.5rem 1fr;
        gap: 0 18px;
        margin: 0;
        font-size: 13px;
      }
      .spec dt {
        color: var(--fine);
        padding: 7px 0;
        border-top: 1px solid var(--rule);
      }
      .spec dd {
        margin: 0;
        padding: 7px 0;
        border-top: 1px solid var(--rule);
        font-variant-numeric: tabular-nums;
      }
      /* At phone width two columns of monospace leaves about nine characters
         for the value. One column, with the label as its own line. */
      @media (max-width: 460px) {
        .spec { grid-template-columns: 1fr; gap: 0; }
        .spec dt { padding-bottom: 0; }
        .spec dd { border-top: 0; padding-top: 2px; padding-bottom: 10px; }
      }

      /* ---- the game ------------------------------------------------------ */

      .game {
        background: var(--panel);
        border: 1px solid var(--rule);
        padding: 20px;
      }
      .game h3 {
        font-family: var(--display);
        font-size: 21px;
        color: var(--score);
        margin: 0 0 4px;
      }
      .game .meta {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--fine);
        margin: 0 0 13px;
      }
      .play {
        display: inline-block;
        margin-top: 6px;
        font-family: var(--display);
        font-size: 14px;
        letter-spacing: 0.06em;
        color: var(--ground);
        background: var(--score);
        padding: 9px 20px;
        text-decoration: none;
      }
      .play:hover, .play:focus-visible { background: #ffe476; }

      /* ---- footer -------------------------------------------------------- */

      footer {
        margin-top: 52px;
        padding-top: 18px;
        border-top: 1px solid var(--rule);
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--fine);
        line-height: 1.7;
      }
      footer a { color: inherit; }
      footer a:hover, footer a:focus-visible { color: var(--faint); }

      @media (prefers-reduced-motion: no-preference) {
        a { transition: text-decoration-color 120ms linear, color 120ms linear; }
        .play { transition: background 120ms linear; }
      }
    </style>
  </head>

  <body>
    <main>
__ABOUT_BODY__
    </main>
  </body>
</html>
