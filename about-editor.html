<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>About editor</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <style>
      /* The site's palette, because this tool edits the site and a different
         set of colours would make the preview a liar. The layout is not the
         site's though — this is a workbench, so it is denser, flatter, and
         organised by what you do rather than by what the reader sees. */
      :root {
        --ground: #060e08;
        --panel:  #0c1a11;
        --panel2: #101f15;
        --score:  #ffd83d;
        --faint:  #8aa899;
        --fine:   #5f7c6b;
        --rule:   #1d2e24;
        --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        --ok: #6ee7a0;
        --bad: #ff7a6b;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--faint);
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.55;
      }

      /* ---- frame ------------------------------------------------------- */

      .app {
        display: grid;
        grid-template-columns: minmax(360px, 480px) 1fr;
        grid-template-rows: auto 1fr;
        height: 100%;
      }
      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--rule);
        background: var(--panel);
      }
      header h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--score);
      }
      .grow { flex: 1; }
      #status { font-size: 11px; color: var(--fine); min-height: 1em; }
      #status.ok { color: var(--ok); }
      #status.bad { color: var(--bad); }

      .pane {
        overflow-y: auto;
        padding: 16px;
      }
      .pane.form { border-right: 1px solid var(--rule); }
      .pane.preview {
        padding: 0;
        background: var(--panel);
        display: flex;
        flex-direction: column;
      }
      iframe { flex: 1; width: 100%; border: 0; background: var(--ground); }

      /* On a laptop in portrait, or any narrow window, the two panes stack and
         the preview gets a fixed height rather than collapsing to nothing. */
      @media (max-width: 900px) {
        .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
        .pane.form { border-right: 0; border-bottom: 1px solid var(--rule); }
        .pane.preview { min-height: 60vh; }
      }

      /* ---- controls ---------------------------------------------------- */

      fieldset {
        border: 1px solid var(--rule);
        border-radius: 0;
        margin: 0 0 14px;
        padding: 12px;
        background: var(--panel);
      }
      legend {
        padding: 0 6px;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--fine);
      }
      label {
        display: block;
        margin: 0 0 10px;
      }
      label > span {
        display: block;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fine);
        margin-bottom: 4px;
      }
      input[type="text"], input[type="number"], textarea, select {
        width: 100%;
        padding: 7px 9px;
        background: var(--ground);
        color: var(--faint);
        border: 1px solid var(--rule);
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.5;
      }
      textarea { resize: vertical; min-height: 68px; }
      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--score);
      }

      button {
        font-family: var(--mono);
        font-size: 12px;
        padding: 7px 13px;
        background: var(--panel2);
        color: var(--faint);
        border: 1px solid var(--rule);
        cursor: pointer;
      }
      button:hover { border-color: var(--fine); color: #cfe0d6; }
      button.primary {
        background: var(--score);
        border-color: var(--score);
        color: #1a1400;
        font-weight: 700;
      }
      button.primary:hover { background: #ffe476; color: #1a1400; }
      button.tiny { padding: 3px 8px; font-size: 11px; }
      button.danger:hover { border-color: var(--bad); color: var(--bad); }

      .row { display: flex; gap: 8px; align-items: center; }
      .row > * { min-width: 0; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

      /* ---- colours ----------------------------------------------------- */

      .swatches { display: grid; gap: 8px; }
      .sw { display: grid; grid-template-columns: 34px 1fr 96px; gap: 8px; align-items: center; }
      .sw input[type="color"] {
        width: 34px; height: 30px; padding: 0;
        background: none; border: 1px solid var(--rule); cursor: pointer;
      }
      .sw .why { font-size: 11px; color: var(--fine); }

      /* ---- sections ---------------------------------------------------- */

      .sec {
        border: 1px solid var(--rule);
        background: var(--panel2);
        padding: 11px;
        margin-bottom: 11px;
      }
      .sec-head {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 9px;
      }
      .sec-kind {
        font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--score); flex: 1;
      }
      .para { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 7px; }
      .para textarea { flex: 1; }
      .specrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; margin-bottom: 6px; }

      .hint {
        font-size: 11px;
        color: var(--fine);
        margin: -4px 0 10px;
      }
      code {
        background: var(--ground);
        border: 1px solid var(--rule);
        padding: 0 4px;
        color: var(--score);
      }
      .thumb {
        display: block;
        max-width: 100%;
        max-height: 76px;
        margin-top: 8px;
        background: var(--ground);
        border: 1px solid var(--rule);
        padding: 5px;
      }
      #drop.over { border-color: var(--score); }
    </style>
  </head>

  <body>
    <div class="app">
      <header>
        <h1>About editor</h1>
        <span id="status"></span>
        <span class="grow"></span>
        <button id="revert" title="Restore the snapshot taken before the last save">Undo last save</button>
        <button id="save" class="primary">Save &nbsp;⌘S</button>
      </header>

      <div class="pane form" id="form"></div>

      <div class="pane preview">
        <iframe id="preview" src="./about.html" title="Preview"></iframe>
      </div>
    </div>

    <script type="module">
      const $ = (s, r = document) => r.querySelector(s);
      const status = $('#status');
      const preview = $('#preview');
      const form = $('#form');

      let state = null;
      let colours = [];
      let images = [];
      let dirty = false;

      function say(msg, kind = '') {
        status.textContent = msg;
        status.className = kind;
      }

      /* --- tiny path helpers, so every input can declare where it writes --- */
      const get = (o, path) => path.split('.').reduce((v, k) => (v == null ? v : v[k]), o);
      function set(o, path, value) {
        const keys = path.split('.');
        const last = keys.pop();
        const tgt = keys.reduce((v, k) => v[k], o);
        tgt[last] = value;
      }

      function mark() {
        dirty = true;
        say('unsaved changes');
      }

      /* --- loading ------------------------------------------------------- */

      async function load() {
        const r = await fetch('/__about/content');
        if (!r.ok) throw new Error('could not read about.content.json');
        const d = await r.json();
        state = d.content;
        colours = d.colours;
        images = d.images;
        draw();
        say('loaded');
      }

      /* --- saving -------------------------------------------------------- */

      async function save() {
        try {
          say('saving…');
          await fetch('/__about/snapshot', { method: 'POST' });
          const r = await fetch('/__about/content', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(state)
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error || 'save failed');
          dirty = false;
          say('saved', 'ok');
          refresh();
        } catch (e) {
          say(e.message, 'bad');
        }
      }

      function refresh() {
        /* The query string is what forces the iframe to re-request the page
           rather than reuse the one it already has. */
        preview.src = './about.html?t=' + Date.now();
      }

      $('#save').addEventListener('click', save);
      $('#revert').addEventListener('click', async () => {
        if (!confirm('Restore the snapshot taken before your last save?')) return;
        try {
          const r = await fetch('/about.content.bak.json?t=' + Date.now());
          if (!r.ok) throw new Error('no snapshot yet');
          state = await r.json();
          draw();
          await save();
          say('reverted', 'ok');
        } catch (e) { say(e.message, 'bad'); }
      });

      addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
          e.preventDefault();
          save();
        }
      });

      addEventListener('beforeunload', (e) => {
        if (dirty) { e.preventDefault(); e.returnValue = ''; }
      });

      /* --- building the form --------------------------------------------- */

      function field(label, path, { type = 'text', hint = '', rows = 0 } = {}) {
        const l = document.createElement('label');
        l.innerHTML = `<span>${label}</span>`;
        const el = document.createElement(rows ? 'textarea' : 'input');
        if (!rows) el.type = type;
        if (rows) el.rows = rows;
        el.value = get(state, path) ?? '';
        el.addEventListener('input', () => {
          set(state, path, type === 'number' ? Number(el.value) : el.value);
          mark();
        });
        l.append(el);
        if (hint) {
          const h = document.createElement('div');
          h.className = 'hint';
          h.innerHTML = hint;
          l.append(h);
        }
        return l;
      }

      function group(title, ...kids) {
        const f = document.createElement('fieldset');
        const lg = document.createElement('legend');
        lg.textContent = title;
        f.append(lg, ...kids.filter(Boolean));
        return f;
      }

      function btn(text, cls, onClick) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = cls;
        b.textContent = text;
        b.addEventListener('click', onClick);
        return b;
      }

      /* --- the mark ------------------------------------------------------ */

      function markGroup() {
        const wrap = document.createElement('div');

        const l = document.createElement('label');
        l.innerHTML = '<span>Image (from public/)</span>';
        const sel = document.createElement('select');
        const opts = ['', ...images];
        if (state.mark && !images.includes(state.mark)) opts.push(state.mark);
        for (const f of opts) {
          const o = document.createElement('option');
          o.value = f;
          o.textContent = f || '— none —';
          if (f === state.mark) o.selected = true;
          sel.append(o);
        }
        sel.addEventListener('change', () => {
          state.mark = sel.value;
          thumb.src = state.mark ? './' + state.mark + '?t=' + Date.now() : '';
          thumb.hidden = !state.mark;
          mark();
        });
        l.append(sel);

        const thumb = document.createElement('img');
        thumb.className = 'thumb';
        thumb.alt = '';
        thumb.hidden = !state.mark;
        if (state.mark) thumb.src = './' + state.mark;

        const drop = document.createElement('div');
        drop.id = 'drop';
        drop.className = 'actions';
        const file = document.createElement('input');
        file.type = 'file';
        file.accept = 'image/*';
        file.hidden = true;
        drop.append(
          btn('Upload a new image…', '', () => file.click()),
          file
        );

        async function upload(f) {
          if (!f) return;
          try {
            say('uploading ' + f.name + '…');
            const r = await fetch('/__about/logo', {
              method: 'POST',
              headers: { 'X-Filename': encodeURIComponent(f.name) },
              body: await f.arrayBuffer()
            });
            const d = await r.json();
            if (!r.ok) throw new Error(d.error || 'upload failed');
            if (!images.includes(d.name)) images.push(d.name);
            state.mark = d.name;
            say('uploaded ' + d.name, 'ok');
            draw();
            mark();
          } catch (e) { say(e.message, 'bad'); }
        }

        file.addEventListener('change', () => upload(file.files[0]));
        for (const ev of ['dragenter', 'dragover']) {
          drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); });
        }
        for (const ev of ['dragleave', 'drop']) {
          drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); });
        }
        drop.addEventListener('drop', (e) => upload(e.dataTransfer.files[0]));

        wrap.append(l, thumb, drop, field('Width on the page (px)', 'markWidth', { type: 'number' }));
        return wrap;
      }

      /* --- colours ------------------------------------------------------- */

      function colourGroup() {
        const wrap = document.createElement('div');
        wrap.className = 'swatches';
        for (const [key, why] of colours) {
          const row = document.createElement('div');
          row.className = 'sw';

          const pick = document.createElement('input');
          pick.type = 'color';
          pick.value = state.colours[key] || '#000000';

          const why_ = document.createElement('div');
          why_.className = 'why';
          why_.textContent = why;

          const hex = document.createElement('input');
          hex.type = 'text';
          hex.value = state.colours[key] || '';

          /* Colour is the one thing worth showing instantly: it applies to the
             preview's own custom properties, so you see it without a save. */
          const apply = (v) => {
            state.colours[key] = v;
            try {
              preview.contentDocument.documentElement.style.setProperty('--' + key, v);
            } catch (e) { /* preview still loading; the save will catch it */ }
            mark();
          };
          pick.addEventListener('input', () => { hex.value = pick.value; apply(pick.value); });
          hex.addEventListener('input', () => {
            if (/^#[0-9a-f]{6}$/i.test(hex.value)) { pick.value = hex.value; apply(hex.value); }
          });

          row.append(pick, why_, hex);
          wrap.append(row);
        }
        return wrap;
      }

      /* --- sections ------------------------------------------------------ */

      function sectionCard(s, i) {
        const card = document.createElement('div');
        card.className = 'sec';

        const head = document.createElement('div');
        head.className = 'sec-head';
        const kind = document.createElement('div');
        kind.className = 'sec-kind';
        kind.textContent = s.type;
        head.append(
          kind,
          btn('↑', 'tiny', () => move(i, -1)),
          btn('↓', 'tiny', () => move(i, 1)),
          btn('Remove', 'tiny danger', () => {
            if (!confirm('Remove this section?')) return;
            state.sections.splice(i, 1); draw(); mark();
          })
        );
        card.append(head, field('Heading', `sections.${i}.heading`));

        if (s.type === 'game') {
          card.append(
            field('Game name', `sections.${i}.name`),
            field('Meta line', `sections.${i}.meta`),
            field('Blurb', `sections.${i}.blurb`, { rows: 4 }),
            field('Button label', `sections.${i}.playLabel`),
            field('Button link', `sections.${i}.playHref`)
          );
        } else if (s.type === 'spec') {
          card.append(field('Intro', `sections.${i}.intro`, { rows: 3 }));
          const rows = document.createElement('div');
          s.rows.forEach((r, j) => {
            const line = document.createElement('div');
            line.className = 'specrow';
            const a = document.createElement('input'); a.type = 'text'; a.value = r[0];
            const b = document.createElement('input'); b.type = 'text'; b.value = r[1];
            a.addEventListener('input', () => { r[0] = a.value; mark(); });
            b.addEventListener('input', () => { r[1] = b.value; mark(); });
            line.append(a, b, btn('×', 'tiny danger', () => { s.rows.splice(j, 1); draw(); mark(); }));
            rows.append(line);
          });
          const add = document.createElement('div');
          add.className = 'actions';
          add.append(btn('Add row', 'tiny', () => { s.rows.push(['', '']); draw(); mark(); }));
          card.append(rows, add);
        } else {
          const paras = document.createElement('div');
          s.paragraphs.forEach((p, j) => {
            const line = document.createElement('div');
            line.className = 'para';
            const t = document.createElement('textarea');
            t.rows = 4;
            t.value = p;
            t.addEventListener('input', () => { s.paragraphs[j] = t.value; mark(); });
            line.append(t, btn('×', 'tiny danger', () => { s.paragraphs.splice(j, 1); draw(); mark(); }));
            paras.append(line);
          });
          const add = document.createElement('div');
          add.className = 'actions';
          add.append(btn('Add paragraph', 'tiny', () => { s.paragraphs.push(''); draw(); mark(); }));
          card.append(paras, add);
        }
        return card;
      }

      function move(i, d) {
        const j = i + d;
        if (j < 0 || j >= state.sections.length) return;
        const [s] = state.sections.splice(i, 1);
        state.sections.splice(j, 0, s);
        draw();
        mark();
      }

      function addSection(type) {
        const base = { type, heading: 'New section' };
        if (type === 'game') Object.assign(base, { name: '', meta: '', blurb: '', playLabel: 'Play', playHref: './' });
        else if (type === 'spec') Object.assign(base, { intro: '', rows: [['', '']] });
        else base.paragraphs = [''];
        state.sections.push(base);
        draw();
        mark();
      }

      /* --- draw ---------------------------------------------------------- */

      function draw() {
        const scroll = form.scrollTop;
        form.textContent = '';

        form.append(group('Page',
          field('Browser tab title', 'title'),
          field('Search / link description', 'description', { rows: 2 })
        ));

        form.append(group('Mark', markGroup()));

        form.append(group('Heading',
          field('Studio name', 'heading'),
          field('One-line pitch', 'pitch', { rows: 2,
            hint: 'Links can be written as <code>[text](https://url)</code> in any field.' })
        ));

        form.append(group('Colours', colourGroup()));

        const secs = document.createElement('div');
        state.sections.forEach((s, i) => secs.append(sectionCard(s, i)));
        const add = document.createElement('div');
        add.className = 'actions';
        add.append(
          btn('+ Text', '', () => addSection('text')),
          btn('+ Game', '', () => addSection('game')),
          btn('+ Spec table', '', () => addSection('spec'))
        );
        form.append(group('Sections', secs, add));

        form.append(group('Footer', field('Footer line', 'footer')));

        form.scrollTop = scroll;
      }

      load().catch((e) => say(e.message, 'bad'));
    </script>
  </body>
</html>
