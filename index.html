<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
    <title>Ridge Run</title>
    <meta name="description" content="An endless runner rendered through a 1994 output stage." />
    <!-- The mark is trimmed of its transparent margin and resampled per size:
         a browser scaling one 1000px image down to 16 makes a smear of it.
         Apple ignores transparency and composites onto black, so that one is
         given the site's own ground rather than letting the OS pick. -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="./icon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- Without this iOS opens the home-screen shortcut chrome-less but still
         reports `display-mode: browser`, so a standalone media query never
         matches and the app-specific layout silently never applies. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      /* Belt and braces, and it runs before first paint so nothing reflows.
         `navigator.standalone` is the iOS-only signal and is true from the
         home screen whatever the media query says — which matters because the
         meta above only takes effect for shortcuts added AFTER it ships. */
      try {
        if (navigator.standalone || matchMedia('(display-mode: standalone)').matches)
          document.documentElement.classList.add('standalone');
      } catch (e) {}
    </script>
    <style>
      :root {
        --ground: #060e08;      /* the cabinet the screen sits in */
        --score:  #ffd83d;
        /* The byline. Was #2f4436, which on a bright cabinet read as a smudge
           rather than text — legible enough to notice, not enough to read. Lifted
           to the same family but well clear of the ground, still cool and green so
           it never competes with the yellow score above it. */
        --faint:  #8aa899;
        --fine:   #5f7c6b;    /* the small print under it — a step quieter again */
        --dim:    #55705f;    /* muted: still legible, clearly switched off */
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--ground);
        /* dvh, not %: a phone's address bar grows and shrinks as you play, and
           a percentage height re-lays-out the page mid-run — which resizes the
           canvas and costs a frame every time the bar moves. */
        height: 100dvh;
        /* No panning, no pinch, no rubber-band. Without this the browser
           spends the first moments of every touch deciding whether you meant
           to scroll, and swallows or delays the press. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        /* The one that stops iOS. `user-select: none` kills the selection
           itself, but Safari still runs its own long-press gesture on top —
           the callout menu and, since iOS 17, the magnifier loupe. Holding to
           duck IS a long press, so without this every duck raises a lens over
           the screen. It does not inherit reliably across shadow boundaries
           and form controls, hence the catch-all below. */
        -webkit-touch-callout: none;
      }
      *, *::before, *::after {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* A held finger on the logo otherwise lifts a drag ghost of the PNG,
         and the drag cancels the pointer stream mid-gesture. */
      img {
        -webkit-user-drag: none;
        user-drag: none;
        pointer-events: none;
      }
      body {
        color: var(--score);
        font-family: 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      /* One column, screen in the middle taking whatever is left. The screen
         gets `min-height: 0` because a flex child will not shrink below its
         content otherwise, and the canvas would push the footer off-screen. */
      .cabinet {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Marquee and screen sit high; the score and byline stay pinned near
           the bottom edge. The leftover collects BETWEEN them (see the auto
           margin on #hiscore) rather than being split above and below, which
           is what lifts the top of the page without moving the text. */
        padding: clamp(6px, 1vh, 14px) 16px clamp(20px, 3.4vh, 40px);
        justify-content: flex-start;
      }

      #logo {
        display: block;
        /* The screen scales in whole multiples of 256x224, so every pixel of
           height spent on chrome can cost a whole step of game. Keep the logo
           on a short leash and let the screen have the rest. */
        width: min(41.8vw, 613px);
        max-height: 13.1vh;
        object-fit: contain;
        flex: 0 0 auto;
        /* Sits ON the screen, the way a cabinet's marquee overhangs the glass.
           The negative margin also hands the space back to the stage, so the
           screen keeps its size instead of paying for the overlap. */
        margin-bottom: clamp(-23px, -1.9vh, -7.6px);
        position: relative;
        z-index: 2;
        pointer-events: none;
      }

      #stage {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        display: flex;
        /* Pinned to the top of its box, not centred: the overlap has to be the
           margin above and nothing else, or leftover slack inside the stage
           quietly eats it on one viewport and not another. */
        align-items: flex-start;
        justify-content: center;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        touch-action: none;
      }

      #hiscore {
        margin: auto 0 0;          /* takes the slack, pinning itself low */
        flex: 0 0 auto;
        /* The SAME face the score inside the screen is drawn in, down to the
           fallback order — the HUD asks a canvas for exactly this stack, so
           anything else here is a second typeface pretending to belong to the
           same machine. No letter-spacing and no uppercasing for the same
           reason: the HUD applies neither, so the lowercase m matches the one
           on the live distance instead of becoming an M. */
        font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
        font-size: var(--score-size, 16px);
        letter-spacing: 0;
        font-weight: 700;
        color: var(--score);
      }
      #hiscore .m { font-size: 0.78em; }

      /* Music mute. Mobile only — a phone has no keyboard to press M on. */
      #m-music {
        display: none;
        padding: 10px;            /* a 26px icon is not a 26px target */
        margin: 8px 0 0;
        background: none;
        border: 0;
        cursor: pointer;
        color: var(--score);
        line-height: 0;
        flex: 0 0 auto;
        touch-action: manipulation;
      }
      #m-music svg { width: clamp(24px, 6.4vw, 34px); height: auto; display: block; }
      /* `display: block` above is an ID-scoped rule, so it OUTRANKS the
         browser's own `[hidden] { display: none }` — without this the muted
         glyph sits under the unmuted one and both show at once. */
      #m-music svg[hidden] { display: none; }
      /* Muted reads two ways at once — the glyph gains a slash AND the colour
         drops out — so it survives a glance. */
      #m-music.off { color: var(--dim); }

      footer {
        /* The byline is a different KIND of thing from the score — one belongs
           to the run, the other to the build — and six pixels read as them
           being one block with a line break in it. Scaled rather than fixed,
           so the separation survives a tall window as well as a short one. */
        margin: clamp(16px, 2.6vh, 34px) 0 0;
        flex: 0 0 auto;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.32em;
        color: var(--faint);
        white-space: nowrap;      /* one line, or the tracking makes it two */
        /* The byline is one nowrap line, so the footer box has always been
           exactly as wide as that line. The small print underneath is longer
           and wraps, so without this it would set the box's width and leave the
           byline hanging off to one side. Centred text keeps both lines on the
           same axis whatever either of them measures. */
        text-align: center;
      }

      /* The small print: credits, source, and where the score lives. A separate
         KIND of line again — the byline names the build, this names the things
         the build stands on — so it is quieter, tracked far less tightly, and
         allowed to wrap. Anything that wraps cannot also be nowrap, and at this
         tracking it does not need to be. */
      footer .fine {
        display: block;
        margin-top: 7px;
        font-size: 10px;
        letter-spacing: 0.06em;
        color: var(--fine);
        white-space: normal;
        max-width: 34em;
        margin-left: auto;
        margin-right: auto;
        line-height: 1.6;
      }
      footer a {
        color: inherit;
        text-decoration: underline;
        /* Held off the baseline so the underline does not collide with the
           descenders in the monospace face. */
        text-underline-offset: 2px;
        text-decoration-color: color-mix(in srgb, currentColor 45%, transparent);
      }
      footer a:hover, footer a:focus-visible { color: var(--faint); }
      /* The byline gained a version and an edition name, and at 0.32em of
         tracking that is 325px of text — wider than a small phone. Tighten
         the tracking rather than let it wrap or clip. */
      @media (max-width: 380px) {
        footer { letter-spacing: 0.16em; font-size: 10px; }
      }

      /* Loading veil. Opaque black over everything until the art has landed —
         the first seconds otherwise show a bare ridge with the scenery popping
         in piece by piece, which reads as a broken page rather than a loading
         one. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(24px, 5vh, 54px);
        transition: opacity 420ms ease;
      }
      #boot img {
        width: min(50vw, 460px);
        max-height: 22vh;
        object-fit: contain;
      }
      #boot .ring {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 4px solid rgba(255, 216, 61, 0.18);
        border-top-color: var(--score);
        animation: spin 820ms linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* Faded out, then taken out of the layer entirely — a transparent
         full-screen div still swallows every click and keypress. */
      #boot.done { opacity: 0; pointer-events: none; }
      #boot.gone { display: none; }
      @media (prefers-reduced-motion: reduce) {
        #boot .ring { animation-duration: 2.4s; }
      }

      /* On a phone the logo eats the screen the game needs. */
      @media (max-aspect-ratio: 1/1) {
        #logo { width: min(83.6vw, 613px); max-height: 13.1vh; margin-bottom: -1.33vh; }
        /* A phone leaves a deep band under the glass, and the desktop rule
           spends all of it above the score — which strands the score on the
           bottom edge with a void between it and the game. An auto margin on
           BOTH sides splits the slack evenly instead, floating the score in
           the middle of that band. */
        /* One number, two elements. The lift is visual only (`relative`), so
           anything that has to travel with the score must carry the SAME
           offset — otherwise the button stays at its layout position down by
           the byline while the score floats 10vh above it. */
        .cabinet { --lift: -13vh; }
        #hiscore {
          /* Anchored to the bottom, then lifted — not centred. The slack all
             collects above it, so the score keeps a fixed distance from the
             byline whatever the screen height, instead of drifting with the
             size of the gap. */
          margin: auto 0 0;
          position: relative;
          top: var(--lift);
        }
        #m-music { display: block; position: relative; top: var(--lift); }

        /* Added to the home screen, there is no address bar and no toolbar, so
           the viewport is ~100px taller — and since the lift above is measured
           in vh, while the screen only scales in whole multiples of 256x224,
           the score drifts away from the game it belongs to. Standalone gets
           its own arrangement instead of a fudged offset: the score and its
           button sit right under the glass, the same 8px apart as they are
           from each other, and ALL the leftover collects below them. */
        .standalone #hiscore { margin: 8px 0 0; position: static; top: auto; }
        .standalone #m-music { position: static; top: auto; }
        .standalone footer { margin-top: auto; }
        /* Nothing stands the page off the bottom edge as an app, so without
           this the byline lands on the home indicator. Zero in Safari. */
        .standalone .cabinet {
          padding-top: calc(clamp(6px, 1vh, 14px) + env(safe-area-inset-top, 0px));
          padding-bottom: calc(clamp(20px, 3.4vh, 40px) + env(safe-area-inset-bottom, 0px));
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <img src="./logo.png" alt="" />
      <div class="ring" role="progressbar" aria-label="Loading"></div>
    </div>

    <div class="cabinet">
      <img id="logo" src="./logo.png" alt="Ridge Run" />
      <div id="stage"></div>
      <p id="hiscore">Best: 0000<span class="m">m</span></p>
      <!-- Inline rather than image files: two colours and a swapped glyph is
           less code than two PNGs, it recolours with `currentColor`, and it
           cannot be the one asset that fails to load. -->
      <button id="m-music" type="button" aria-label="Mute music" aria-pressed="false">
        <svg data-on viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18V5l12-2v13" />
          <circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" />
        </svg>
        <svg data-off hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18V5l12-2v13" />
          <circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" />
          <path d="M3 2l18 20" />
        </svg>
      </button>

      <footer>
        <a href="./about.html">Beef13</a> &middot; 2026 &middot; v__VERSION__ &middot; Beta
        <span class="fine">
          <a href="./about.html">About</a>
          &middot; Built with <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a>
          &middot; Your best score is saved in this browser and nowhere else
        </span>
      </footer>
    </div>
    <script>
      /* The last word on the iOS magnifier.
       *
       * CSS gets you most of the way — `user-select: none` kills the selection
       * and `-webkit-touch-callout: none` kills the copy/paste menu — but from
       * iOS 17 the loupe is raised by Safari's own long-press gesture
       * recogniser, which runs before any of that is consulted. The only thing
       * that stands it down is preventing the default on `touchstart`, and it
       * has to be a NON-PASSIVE listener or the call is ignored outright.
       *
       * Pointer events are unaffected: preventing the touch default suppresses
       * the native UI and the synthesised mouse events, not pointerdown /
       * pointermove / pointerup, which is the whole input path. The guard
       * exists for the dev panels — a slider you cannot drag is a worse bug
       * than a magnifier.
       */
      document.addEventListener('touchstart', (e) => {
        if (e.target.closest && e.target.closest('input,select,textarea,button,label,a,[contenteditable]')) return;
        e.preventDefault();
      }, { passive: false });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
