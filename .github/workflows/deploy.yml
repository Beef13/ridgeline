name: Deploy to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:          # so you can redeploy without a commit

# What Pages needs to accept a build from Actions rather than from a branch.
permissions:
  contents: read
  pages: write
  id-token: write

# A deploy already running is stale the moment a newer commit lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The logic tests need no browser and take about a second. Running them
      # here means a broken jump curve or a scatter regression never reaches
      # the live site — the build simply stops.
      - run: npm run test:logic
      - run: npm run build
      # A missing asset does not fail a build — it 404s in the browser, quietly,
      # and only on the published site. The logo shipped absent once because
      # .gitignore was swallowing it; this makes that a red build instead.
      - name: Check the build has its assets
        run: |
          for f in dist/logo.png dist/design.json dist/art/index.json \
                   dist/audio/jump.mp3 dist/audio/duck.mp3 dist/audio/crash.mp3 \
                   dist/audio/ethnic-flute-ambient.mp3; do
            [ -s "$f" ] || { echo "::error::missing from the build: $f"; exit 1; }
          done
          node -e "
            const a = require('./dist/art/index.json');
            const d = require('./dist/design.json');
            const want = [...new Set(d.assets.map(x => x.file))];
            const missing = want.filter(w => !a.includes(w) && !a.some(f => f.startsWith(w)));
            if (missing.length) { console.error('::error::art the design needs is not in the build: ' + missing.join(', ')); process.exit(1); }
            console.log(want.length + ' art files all present');
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
